services:
  - type: web
    name: beep-job-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DATABASE_URL
        value: sqlite:///./jobs.db
      - key: CORS_ORIGINS
        value: '["*"]'
      - key: ENV
        value: production
